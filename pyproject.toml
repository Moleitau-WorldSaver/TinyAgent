[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyagent"
version = "0.1.0"
description = "A minimal model-and-tools agent loop"
requires-python = ">=3.11"

[project.scripts]
tinyagent = "tinyagent.cli:main"

[tool.setuptools.packages.find]
include = ["tinyagent*"]


